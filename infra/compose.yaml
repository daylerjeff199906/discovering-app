# Infraestructura local de Por aquí (PostgreSQL y Redis). Versiones fijadas (sin tags flotantes).
# Archivos: Cloudflare R2. Correo: Resend. Ambos son servicios externos (ver .env.example).
# Uso: pnpm infra:up   (lee ../.env para puertos y credenciales de desarrollo)
name: por-aqui

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poraqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poraqui_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-poraqui}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poraqui} -d ${POSTGRES_DB:-poraqui}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20


volumes:
  pgdata:
  redisdata:
