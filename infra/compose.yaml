# Infraestructura local de Por aquí. Versiones fijadas (sin tags flotantes).
# Uso: pnpm infra:up   (lee ../.env para puertos y credenciales de desarrollo)
name: por-aqui

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poraqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poraqui_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-poraqui}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poraqui} -d ${POSTGRES_DB:-poraqui}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # MinIO dejó de publicar imágenes oficiales en Docker Hub (oct. 2025): se usa la build comunitaria
    # fijada de coollabsio (solo desarrollo; ver docs/DEPENDENCIES.md).
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-poraqui_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-poraqui_minio_secret}
      # Solo desarrollo: el navegador sube directamente con URLs prefirmadas.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "${S3_PORT:-9010}:9000"
      - "${S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Crea el bucket privado (sin política pública anónima).
  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo bucket-ready"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-poraqui_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-poraqui_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-poraqui-media}

  mailpit:
    image: axllent/mailpit:v1.24.1
    ports:
      - "${SMTP_PORT:-1030}:1025"
      - "${MAILPIT_UI_PORT:-8030}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  miniodata:
